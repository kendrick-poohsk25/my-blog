<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <title>나의 블로그</title>
  <link rel="icon" href="data:,">
  <script>
    // 화면이 그려지기 전에 테마를 정해 깜빡임을 막는다
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) { theme = null; }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">나의 블로그</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드로 전환">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 나의 블로그</div>
  </footer>

  <noscript>
    <p class="container status">이 블로그는 JavaScript가 켜져 있어야 볼 수 있습니다.</p>
  </noscript>
</body>
</html>
