<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>안전지대</title>
  <meta name="description" content="작은 사업장을 위한 중대재해 예방 도우미 — 자가진단, 관리체계 체크리스트, 위험성평가, TBM 기록을 브라우저에서.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <script>
    // 화면이 그려지기 전에 테마를 정해 깜빡임(FOUC)을 막습니다.
    (() => {
      let theme = 'system';
      try {
        const raw = localStorage.getItem('sz:settings');
        const parsed = raw ? JSON.parse(raw) : null;
        const saved = parsed && parsed.value && parsed.value.theme;
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (e) {
        theme = 'system';
      }
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">본문으로 건너뛰기</a>

  <header class="app-header">
    <a class="brand" href="#/" aria-label="안전지대 홈">
      <img src="assets/icon.svg" alt="" width="28" height="28">
      <span>안전지대</span>
    </a>
    <div class="header-actions">
      <a class="header-link" href="../../">블로그</a>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="다크 모드로 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div id="storage-banner" class="storage-banner" role="status" hidden>
    브라우저 저장소를 쓸 수 없어 입력한 내용이 저장되지 않습니다(임시 모드). 더보기에서 백업을 내려받으세요.
  </div>

  <div class="layout">
    <nav class="tabbar" aria-label="주요 메뉴">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>홈</span>
      </a>
      <a href="#/duties" data-tab="duties">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 13l2.5 2.5 4.5-5"/></svg>
        <span>체크리스트</span>
      </a>
      <a href="#/risk" data-tab="risk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18v.5"/></svg>
        <span>위험성평가</span>
      </a>
      <a href="#/log" data-tab="log">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h4"/></svg>
        <span>기록</span>
      </a>
      <a href="#/more" data-tab="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        <span>더보기</span>
      </a>
    </nav>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <dialog id="disclaimer-dialog" class="dialog" aria-labelledby="disclaimer-title">
    <h2 id="disclaimer-title">사용 전에 꼭 읽어 주세요</h2>
    <div class="dialog-body"></div>
    <button type="button" class="btn btn-primary btn-block" data-accept>확인했습니다</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <section id="print-area" class="print-area" aria-hidden="true"></section>
</body>
</html>
